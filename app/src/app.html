<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#04101F" />
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.svg"
      type="image/svg+xml"
    />
    <link rel="alternate icon" href="%sveltekit.assets%/icons/favicon.png" />
    <link
      rel="apple-touch-icon"
      href="%sveltekit.assets%/icons/apple-touch-icon.png"
    />
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    <meta name="application-name" content="TripWire" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TripWire" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
